[platformio]
default_envs = esp8266

[env]
framework = arduino
monitor_speed = 9600
extra_scripts = pre:tools/platformio_identity.py
build_flags = -DSSD1306_NO_SPLASH
lib_deps =
    etherkit/Etherkit Si5351@2.2.0
    etherkit/Etherkit JTEncode@1.3.1
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SSD1306@2.5.17

[env:nano_every]
platform = platformio/atmelmegaavr@1.10.0
board = nano_every
build_flags =
    ${env.build_flags}
    -DWSPR_PROFILE_HISTORICAL

[esp8266_base]
platform = platformio/espressif8266@4.2.1
board = nodemcuv2
build_src_filter =
    +<*>
    -<Esp32ConfigStorage.cpp>
    -<HttpNonBlockingWriter.cpp>
lib_deps =
    ${env.lib_deps}
    plerup/EspSoftwareSerial@8.2.0

[env:esp8266]
extends = esp8266_base
build_flags =
    ${env.build_flags}
    -Wl,-Map,.pio/build/esp8266/firmware.map
    -DWSPR_PROFILE_DEVELOPMENT

[env:esp8266_public]
extends = esp8266_base
build_flags =
    ${env.build_flags}
    -Wl,-Map,.pio/build/esp8266_public/firmware.map
    -DWSPR_PROFILE_PUBLIC

[esp32_base]
platform = platformio/espressif32@7.1.3
board = esp32dev
build_src_filter =
    +<*>
    -<Esp8266ConfigStorage.cpp>

[env:esp32]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -DWSPR_PROFILE_DEVELOPMENT

[env:esp32_public]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -DWSPR_PROFILE_PUBLIC

[native_base]
platform = platformio/native@1.2.1
framework =
lib_deps =
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<ApplicationStatusJson.cpp>
    +<FirmwareIdentity.cpp>
    +<ConfigurationJson.cpp>
    +<ConfigurationMutationJson.cpp>
    +<ConfigurationSaveJson.cpp>
    +<BandPlan.cpp>
    +<DiagnosticRegistry.cpp>
    +<DashboardPage.cpp>
    +<ConfigurationPage.cpp>
    +<ProvisioningPage.cpp>
    +<ProvisioningWifiJson.cpp>
    +<ApSetupRequestJson.cpp>
    +<ApSetupRequestService.cpp>
    +<ProvisioningSecurity.cpp>
    +<ProvisioningOperationalJson.cpp>
    +<BootModeController.cpp>
    +<ApSetupMarker.cpp>
    +<ProvisioningScanJson.cpp>
    +<WifiScanController.cpp>
    +<HardwareCheckController.cpp>
    +<HttpDiagnostics.cpp>
    +<HttpNonBlockingWriter.cpp>
    +<HttpServiceGate.cpp>
    +<HttpTransportCore.cpp>
    +<IdleStatusScreen.cpp>
    +<OledPageController.cpp>
    +<OledDisplayPolicy.cpp>
    +<PowerSaveDisplayPolicy.cpp>
    +<TxDisplayCoordinator.cpp>
    +<TxStatusScreen.cpp>
    +<ConsoleStatus.cpp>
    +<ConsoleStatusFormatter.cpp>
    +<ConfigCommandParser.cpp>
    +<ConfigurationService.cpp>
    +<ConfigurationSessionController.cpp>
    +<ConfigurationSessionJson.cpp>
    +<ConfigValidator.cpp>
    +<WsprConfigAdapter.cpp>
    +<WsprScheduler.cpp>
    +<LocatorService.cpp>
    +<ManualTxController.cpp>
    +<FactoryResetCore.cpp>
    +<FactoryResetService.cpp>
    +<FactoryResetJson.cpp>
    +<CommandLineBuffer.cpp>
    +<ConsoleMode.cpp>
    +<ConsoleInputEcho.cpp>
    +<ConsoleMenu.cpp>
    +<RfSafetyController.cpp>
    +<StatusLedController.cpp>
    +<StartupBanner.cpp>
    +<StartupController.cpp>
    +<PersistentConfigRecord.cpp>
    +<ConfigurationManager.cpp>
    +<WifiCredentials.cpp>
    +<WifiConnectionTracker.cpp>
    +<GpsReceiver.cpp>
    +<PpsQualifier.cpp>
    +<GpsTimeAdapter.cpp>
    +<NtpProviderCore.cpp>
    +<OperationalStatusScreen.cpp>
    +<PreparingStatusScreen.cpp>
    +<TimeService.cpp>
    +<TimeAuthorityLedController.cpp>
    +<TxTelemetry.cpp>
    +<WsprTransmitter.cpp>
    +<WsprFrequencySelector.cpp>
    +<NmeaParser.cpp>
    +<Maidenhead.cpp>

[env:native]
extends = native_base
build_flags =
    -I test/native_stubs
    -DWSPR_PROFILE_DEVELOPMENT

[env:native_public]
extends = native_base
build_flags =
    -I test/native_stubs
    -DWSPR_PROFILE_PUBLIC
